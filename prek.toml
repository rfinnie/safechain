#
# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = false

[update]
cooldown_days = 7
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-xml" },
  {
    id = "check-yaml",
    args = ["--unsafe"]
  },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "check-toml" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "cba56bcde1fdd01c1deb3f945e69764c291a6530"
hooks = [
  {
    id = "yamllint",
    args = [
      "-c",
      ".yamllint.yml"
    ]
  }
]

[[repos]]
repo = "https://codeberg.org/fsfe/reuse-tool"
rev = "a1bb792acda6fd0724936b4ebbdbc8eceb9c0459"
hooks = [
  { id = "reuse-lint-file" }
]

[[repos]]
repo = "https://forge.colobox.com/rfinnie/woodpecker-shellcheck"
rev = "aa1061cff5d2f6888ea0592f1faed65d2c14916a"
hooks = [
  { id = "woodpecker-shellcheck" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "shellcheck",
    name = "ShellCheck",
    entry = "shellcheck",
    language = "system",
    types = ["shell"]
  },
  {
    id = "shfmt",
    name = "shfmt Shell Formatter",
    entry = "shfmt --diff -i 4",
    language = "system",
    types = ["shell"]
  }
]
